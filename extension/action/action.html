<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="action.css"></head>
<body>
  <div class="wrap">
    <label class="row">
      <span>KhmerLens on this tab</span>
      <input type="checkbox" id="toggle" class="switch">
    </label>
    <p class="hint">When on, hover Khmer text on the page to see instant
      definitions.</p>
    <label class="row">
      <span>Paste panel</span>
      <input type="checkbox" id="panelToggle" class="switch">
    </label>
    <p class="hint">A side panel for text KhmerLens can’t read directly, like
      Google Docs or PDFs. Paste Khmer text into it and hover over words the
      same way you would on a page.</p>
    <p class="hint" id="blocked" hidden>This page can’t run KhmerLens.</p>
  </div>
  <script src="action.js"></script>
</body>
</html>
